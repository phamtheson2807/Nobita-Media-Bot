# Fly.io configuration for the Telegram media bot.
# The bot uses long polling, so one Machine must stay running continuously.

app = "nobita-media-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  PUBLIC_BASE_URL = "https://nobita-media-bot.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
